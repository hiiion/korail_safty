{% extends "base.html" %}
{% block title %}부적합 관리 — {{ APP_NAME }}{% endblock %}
{% block hdr_sub %}부적합 관리{% endblock %}
{% block content %}
<h1 class="page-title">부적합 관리</h1>
<p class="page-sub">제출·확정된 점검의 부적합 항목 개선조치를 관리합니다. 최초 보고서는 보존되며 변경 내용은 이력으로 기록됩니다.</p>
<div class="kpis" id="ngKpis"></div>
<div class="card filter-box">
  <div class="grid3">
    <div class="field"><label class="f" for="nf-status">조치 상태</label><select class="inp" id="nf-status" data-nf="status"><option value="">전체</option><option value="undone">미완료(미조치+조치 중)</option>{% for k, v in ACTION_LABELS.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></div>
    <div class="field"><label class="f" for="nf-risk">위험도</label><select class="inp" id="nf-risk" data-nf="risk"><option value="">전체</option>{% for k, v in RISK_LABELS.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select></div>
    <div class="field"><label class="f" for="nf-q">검색</label><input class="inp" id="nf-q" data-nf="q" placeholder="장소·항목·담당자·관리번호"></div>
  </div>
  <div class="chips">
    <label class="chip lab"><input type="checkbox" data-nf="overdue"> 기한 초과만</label>
    <label class="chip lab"><input type="checkbox" data-nf="repeat"> 반복 지적만</label>
    <span class="hint" id="nfCount"></span>
  </div>
</div>
<div id="ngList"><div class="empty"><span class="ic">⏳</span>불러오는 중…</div></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/ng.js') }}"></script>{% endblock %}
