<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003A75">
<title>스마트 철도차량 안전점검 시스템</title>
<style>
/* =========================================================
   스마트 철도차량 안전점검 시스템 - 스타일
   ========================================================= */
:root{
  --blue:#0054A6; --navy:#003A75; --blue-50:#E8F1FB; --blue-100:#CFE2F6;
  --bg:#F4F7FB; --card:#fff; --line:#DCE3EC; --text:#1B2430; --sub:#5B6777;
  --ok:#2E9E5B; --ok-bg:#E6F5EC; --ng:#D93636; --ng-bg:#FCEAEA;
  --none:#9AA3AE; --none-bg:#EEF1F4; --na:#B9C0C9; --na-bg:#F4F6F8;
  --warn:#D9822B; --warn-bg:#FDF1E4;
  --header-h:60px; --tab-h:64px; --action-h:72px;
  --radius:14px; --shadow:0 2px 10px rgba(0,40,90,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.5;color:var(--text);background:var(--bg);overflow-x:hidden;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;
  border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:16px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{background:var(--ng);border-color:var(--ng);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.outline{border-color:var(--blue);color:var(--blue)}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px;border-radius:10px}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:19px;border-radius:16px}

/* ---------- 입력 ---------- */
label.f{display:block;font-weight:700;margin:0 0 6px;font-size:15px}
label.f .req{color:var(--ng);margin-left:2px}
.inp{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:3px solid var(--blue-100);border-color:var(--blue)}
.inp.invalid,.seg.invalid{border-color:var(--ng)!important;background:#FFF6F6}
.field{margin-bottom:14px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.hint{font-size:14px;color:var(--sub)}
.err-msg{color:var(--ng);font-size:14px;font-weight:700;margin-top:4px}

/* 세그먼트 버튼 */
.seg{display:flex;flex-wrap:wrap;gap:8px;border-radius:12px;padding:2px;border:1.5px solid transparent}
.seg button{flex:1 1 120px;min-height:52px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:700;padding:6px 10px}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- 로그인 ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,var(--navy) 0%,var(--blue) 60%,#2F7FD0 100%)}
.login-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:32px 26px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.login-logo{width:64px;height:64px;border-radius:18px;background:var(--blue-50);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.login-card h1{font-size:24px;margin:0 0 4px;color:var(--navy)}
.login-card p{margin:0 0 22px;color:var(--sub)}

/* ---------- 앱 레이아웃 ---------- */
#app{min-height:100vh}
.header{position:sticky;top:0;z-index:40;height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header .title{font-weight:800;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header .title small{font-weight:500;opacity:.75;font-size:13px;margin-left:6px}
.header .btn{min-height:40px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;padding:0 12px;font-size:15px}
.save-state{font-size:13px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.14);white-space:nowrap}
.save-state.saving{background:#F2B544;color:#3A2A00}
.save-state.fail{background:var(--ng)}
.save-state.saved{background:rgba(46,158,91,.85)}
.layout{display:flex}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:18px 16px calc(var(--tab-h) + 24px)}
.main.has-action{padding-bottom:calc(var(--tab-h) + var(--action-h) + 28px)}
.wrap{max-width:1100px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;height:var(--tab-h);display:flex;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;white-space:nowrap;letter-spacing:-.3px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--sub);gap:2px;min-width:0}
.tabbar button .ic{font-size:22px;line-height:1}
.tabbar button.on{color:var(--blue)}
.actionbar{position:fixed;left:0;right:0;bottom:var(--tab-h);z-index:44;background:#fff;border-top:1px solid var(--line);
  box-shadow:0 -4px 14px rgba(0,40,90,.08);padding:10px 12px;display:flex;gap:8px}
.actionbar .btn{flex:1;min-width:0;padding:0 8px;font-size:15.5px}
@media(min-width:1024px){
  .sidebar{display:block;width:232px;flex:0 0 232px;background:#fff;border-right:1px solid var(--line);position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));padding:16px 12px}
  .sidebar button{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:0;background:none;border-radius:12px;padding:0 14px;font-weight:700;font-size:16px;color:var(--sub);text-align:left}
  .sidebar button.on{background:var(--blue-50);color:var(--blue)}
  .sidebar .ic{font-size:20px}
  .tabbar{display:none}
  .main{padding:24px 28px 40px}
  .main.has-action{padding-bottom:calc(var(--action-h) + 30px)}
  .actionbar{left:232px;bottom:0;justify-content:flex-end}
  .actionbar .btn{flex:0 1 220px}
}

/* ---------- 공통 카드 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;min-width:0}
.card h2,.card h3{margin:0 0 12px;font-size:18px;color:var(--navy)}
.card h3{font-size:17px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.sec-title h2{margin:0}
.page-title{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 4px}
.page-sub{color:var(--sub);margin:0 0 16px;font-size:15px}
.notice{background:var(--blue-50);border:1px solid var(--blue-100);color:var(--navy);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-bottom:16px}
.notice.warn{background:var(--warn-bg);border-color:#F1C998;color:#7A4510}
.notice.danger{background:var(--ng-bg);border-color:#F1B5B5;color:#8A1E1E}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.empty .ic{font-size:36px;display:block;margin-bottom:6px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border-top:5px solid var(--blue);min-width:0}
.kpi .lab{font-size:14px;color:var(--sub);font-weight:700}
.kpi .val{font-size:30px;font-weight:800;line-height:1.2;margin-top:4px}
.kpi .val small{font-size:15px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi .foot{font-size:13px;color:var(--sub);margin-top:4px}
.kpi.ok{border-top-color:var(--ok)} .kpi.ok .val{color:var(--ok)}
.kpi.ng{border-top-color:var(--ng)} .kpi.ng .val{color:var(--ng)}
.kpi.warn{border-top-color:var(--warn)} .kpi.warn .val{color:var(--warn)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dash-grid>.card{margin-bottom:0}
@media(max-width:820px){.dash-grid{grid-template-columns:1fr}}
.start-wrap{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:640px){.start-wrap{grid-template-columns:1fr}}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:0 0 150px}
.donut::after{content:"";position:absolute;inset:24px;background:#fff;border-radius:50%}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;text-align:center}
.donut .c b{font-size:26px;color:var(--navy);line-height:1.1}
.donut .c span{font-size:12.5px;color:var(--sub)}
.legend{list-style:none;padding:0;margin:0;font-size:15px;flex:1;min-width:150px}
.legend li{display:flex;align-items:center;gap:8px;margin:6px 0}
.legend i{width:14px;height:14px;border-radius:4px;flex:0 0 14px}
.legend b{margin-left:auto}
/* bars */
.hbar{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:8px;margin:8px 0;font-size:14.5px}
.hbar .track{height:18px;background:var(--none-bg);border-radius:9px;overflow:hidden}
.hbar .fill{height:100%;background:var(--ng);border-radius:9px}
.hbar b{text-align:right}

/* 리스트 */
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.row-btn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 4px;min-height:56px}
.row-btn .main-t{font-weight:700}
.row-btn .meta{font-size:14px;color:var(--sub)}
.row-btn .grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--blue-50);color:var(--blue);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.ng{background:var(--ng-bg);color:var(--ng)}
.chip.none{background:var(--none-bg);color:#5d6570}
.chip.warn{background:var(--warn-bg);color:#A85A12}
.chip.dark{background:var(--navy);color:#fff}
.risk{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:20px;color:#fff;white-space:nowrap}
.risk.h{background:#C62828}.risk.m{background:#E08A1E}.risk.l{background:#3C8DBC}
.st{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap}
.st.s0{background:var(--ng-bg);color:var(--ng)} .st.s1{background:var(--warn-bg);color:#A85A12} .st.s2{background:var(--ok-bg);color:var(--ok)}

/* 단계 탭 */
.steps{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{word-break:keep-all;flex:1 1 0;min-width:0;white-space:normal;line-height:1.25;min-height:52px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-weight:700;color:var(--sub);padding:0 12px;font-size:15px}
.steps button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.steps button.done{border-color:var(--ok);color:var(--ok)}
.steps button[disabled]{opacity:.45}

/* 체크리스트 구성 */
.compose-cat{border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.compose-cat.on{border-color:var(--blue);background:#FAFCFF}
.compose-head{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px}
.compose-head input[type=checkbox]{width:24px;height:24px;flex:0 0 24px}
.compose-head .nm{font-weight:800;flex:1;min-width:0}
.compose-items{margin:0;padding:0 16px 12px 48px;font-size:14.5px;color:var(--sub)}

/* 점검 수행: 고정 요약 */
.sticky-sum{position:sticky;top:var(--header-h);z-index:30;background:var(--bg);padding:8px 0 10px;margin:-8px 0 8px}
.sum-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.prog-line{display:flex;align-items:center;gap:10px;font-weight:800}
.prog{flex:1;height:14px;background:var(--none-bg);border-radius:8px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#2F7FD0);transition:width .3s}
.tally{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tally span{font-size:13.5px;font-weight:800;padding:3px 10px;border-radius:20px}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-ng{background:var(--ng-bg);color:var(--ng)}.t-na{background:var(--na-bg);color:#6b737d}.t-none{background:var(--none-bg);color:#59616b}
.jump{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:thin}
.jump button{flex:0 0 auto;min-height:38px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:0 12px;font-size:14px;font-weight:700;color:var(--navy)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filters button{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:0 14px;font-size:14.5px;font-weight:700}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

/* 아코디언 */
.acc{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--header-h) + 190px)}
.acc-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:14px;min-height:64px;text-align:left}
.acc-head .nm{font-weight:800;font-size:17px;color:var(--navy)}
.acc-head .cnt{font-weight:800;color:var(--sub);font-size:15px}
.acc-head .mini{width:100%;height:6px;background:var(--none-bg);border-radius:4px;overflow:hidden;margin-top:6px}
.acc-head .mini i{display:block;height:100%;background:var(--blue)}
.acc-head .arrow{font-size:20px;transition:transform .2s;color:var(--sub)}
.acc.open .acc-head .arrow{transform:rotate(180deg)}
.acc-body{display:none;padding:0 12px 12px}
.acc.open .acc-body{display:block}
.acc-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}

/* 점검 항목 */
.item{border:1.5px solid var(--line);border-left:6px solid var(--none);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;scroll-margin-top:calc(var(--header-h) + 200px)}
.item.r-ok{border-left-color:var(--ok)}
.item.r-ng{border-left-color:var(--ng);border-color:#F1B5B5}
.item.r-na{border-left-color:var(--na)}
.item.r-none{background:#FAFBFC}
.item.missing{background:#F0F2F5;border-color:#8A94A3;box-shadow:0 0 0 3px rgba(138,148,163,.35)}
.item.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 5px rgba(0,84,166,.35)}}
.item-top{display:flex;gap:8px;align-items:flex-start}
.item-no{flex:0 0 auto;font-weight:800;color:var(--sub);min-width:34px}
.item-text{flex:1;font-weight:700;font-size:16.5px;min-width:0}
.item-state{font-size:12.5px;font-weight:800;padding:2px 8px;border-radius:12px;white-space:nowrap}
.item-menu{border:0;background:none;font-size:20px;min-width:40px;min-height:40px;border-radius:8px;color:var(--sub)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.res button{min-height:54px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px}
.res button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.res button.ng.on{background:var(--ng);border-color:var(--ng);color:#fff}
.res button.na.on{background:#7D8794;border-color:#7D8794;color:#fff}
.item-sub{margin-top:10px}
.ng-panel{border:2px solid var(--ng);background:#FFF8F8;border-radius:12px;padding:12px;margin-top:10px}
.ng-panel h4{margin:0 0 10px;color:var(--ng);font-size:16px}
.ext{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ext .btn{min-height:44px;font-size:15px}
.history-badge{border:0;background:var(--warn-bg);color:#A85A12;font-weight:800;font-size:13px;padding:4px 10px;border-radius:14px;margin-top:6px}

/* 사진 */
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#EEF2F6}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .x{position:absolute;top:3px;right:3px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.ph .rp{position:absolute;bottom:3px;right:3px;height:26px;border-radius:13px;border:0;background:rgba(0,84,166,.9);color:#fff;font-size:12px;padding:0 8px;font-weight:700}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.compare>div{border:1px dashed var(--line);border-radius:10px;padding:8px;min-width:0;background:#fff}
.compare h5{margin:0 0 4px;font-size:14px}
.upl{display:inline-flex}

/* 이력/부적합 표 */
.filter-box .grid3,.filter-box .grid2{gap:0 12px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.tbl th{background:#F0F4F9;color:var(--navy);white-space:nowrap}
.ngc{border:1px solid var(--line);border-left:6px solid var(--ng);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.ngc.done{border-left-color:var(--ok)}
.ngc.inprog{border-left-color:var(--warn)}
.ngc .hd{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.ngc .ttl{font-weight:800;font-size:16.5px;margin:4px 0}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:14.5px;margin:8px 0}
.kv dt{color:var(--sub);font-weight:700}
.kv dd{margin:0;min-width:0}
.log{font-size:13.5px;color:var(--sub);margin:6px 0 0;padding-left:18px}

/* 설정 */
.tpl-cat{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.tpl-cat summary{padding:12px 14px;font-weight:800;cursor:pointer;background:#F7F9FC;min-height:52px;display:flex;align-items:center;gap:8px}
.tpl-item{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:15px}
.tpl-item span{flex:1;min-width:0}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,45,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal h3{margin:0 0 10px;font-size:19px;color:var(--navy)}
.modal .body{margin-bottom:16px;font-size:15.5px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .foot .btn{flex:1 1 140px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:120;display:flex;align-items:center;justify-content:center;padding:14px}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px}
.lightbox button{position:absolute;top:12px;right:12px;min-height:48px;min-width:48px;border-radius:50%;border:0;background:#fff;font-size:20px}

/* 토스트 */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--action-h) + 14px);z-index:130;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
@media(min-width:1024px){#toasts{bottom:96px}}
.toast{background:#1F2B3A;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .25s ease}
.toast.ok{background:#1E7B45}.toast.err{background:#B52A2A}.toast.warn{background:#A85A12}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

.disclaimer{font-size:13px;color:var(--sub);text-align:center;margin-top:20px;line-height:1.6}

/* ---------- 보고서 (A4) ---------- */
.report-stage{background:#E4E9F0;border-radius:14px;padding:14px;overflow-x:auto}
.a4{width:210mm;min-height:297mm;margin:0 auto 14px;background:#fff;padding:15mm;box-shadow:0 2px 10px rgba(0,0,0,.15);color:#111;font-size:10.5pt;line-height:1.45}
.a4-scale{transform-origin:top left}
.rpt h1{font-size:19pt;text-align:center;margin:0 0 2mm;color:#003A75;letter-spacing:1px}
.rpt .rpt-sub{text-align:center;font-size:9.5pt;color:#555;margin-bottom:4mm}
.rpt h2{font-size:12pt;margin:6mm 0 2mm;padding:1.5mm 3mm;background:#003A75;color:#fff;border-radius:2px}
.rpt table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:2mm}
.rpt th,.rpt td{border:1px solid #9AA6B5;padding:1.6mm 2mm;vertical-align:top;text-align:left}
.rpt th{background:#E8F1FB;color:#003A75;white-space:nowrap}
.rpt .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:4mm;margin-bottom:4mm}
.rpt .docno{font-size:9.5pt}
.rpt .sign{border-collapse:collapse;width:auto}
.rpt .sign th,.rpt .sign td{text-align:center;width:22mm}
.rpt .sign td{height:16mm}
.rpt .c-ok{color:#2E9E5B;font-weight:800}.rpt .c-ng{color:#D93636;font-weight:800}.rpt .c-na{color:#7D8794;font-weight:800}
.rpt .sumbar{display:flex;height:6mm;border-radius:2px;overflow:hidden;border:1px solid #9AA6B5;margin:2mm 0}
.rpt .sumbar i{display:block;height:100%}
.rpt .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.rpt .pcell{border:1px solid #9AA6B5;padding:2mm;break-inside:avoid;page-break-inside:avoid}
.rpt .pcell img{width:100%;height:55mm;object-fit:cover;display:block;background:#eee}
.rpt .pcell .cap{font-size:8.5pt;margin-top:1mm}
.rpt .pair{display:grid;grid-template-columns:1fr 1fr;gap:2mm}
.rpt .opinion{border:1px solid #9AA6B5;padding:3mm;white-space:pre-wrap;min-height:25mm}
.rpt .note{font-size:8.5pt;color:#555;margin-top:3mm;border-top:1px dashed #aaa;padding-top:2mm}
.rpt tr,.rpt .avoid{break-inside:avoid;page-break-inside:avoid}
.rpt .badge-mode{display:inline-block;border:1px solid #003A75;color:#003A75;font-size:8.5pt;padding:0.5mm 2mm;border-radius:2px}

#printArea{display:none}
@media print{
  @page{size:A4;margin:15mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .a4{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
}

<script>
/* =========================================================
   시연용 현장 사진 (캔버스 절차적 렌더링, 외부 이미지 미사용)
   - 실제 사진이 아닌 '현장 사진 느낌'의 예시 이미지입니다.
   ========================================================= */
const SCN = (() => {
  const W = 800, H = 600;
  const mul = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  function noise(x, amt, R, mono = true) {
    const d = x.getImageData(0, 0, W, H), p = d.data;
    for (let i = 0; i < p.length; i += 4) { const n = (R() - .5) * amt; p[i] += n; p[i + 1] += mono ? n : (R() - .5) * amt; p[i + 2] += mono ? n : (R() - .5) * amt; }
    x.putImageData(d, 0, 0);
  }
  function vignette(x, s = .55) { const g = x.createRadialGradient(W / 2, H / 2, H * .28, W / 2, H / 2, H * .9); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${s})`); x.fillStyle = g; x.fillRect(0, 0, W, H); }
  function grade(x, c) { x.save(); x.globalCompositeOperation = 'soft-light'; x.fillStyle = c; x.fillRect(0, 0, W, H); x.restore(); }
  function stamp(x, date) {
    const d = new Date(date || Date.now()); const p = n => String(n).padStart(2, '0');
    const t = `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    x.font = 'bold 24px "Courier New",monospace'; x.textAlign = 'right';
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillText(t, W - 18, H - 18); x.fillStyle = '#FFA32A'; x.fillText(t, W - 20, H - 20);
  }
  function blob(x, cx, cy, rx, ry, R, n = 26, jag = .28) {
    x.beginPath();
    for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2; const r = 1 + (R() - .5) * jag * 2; const px = cx + Math.cos(a) * rx * r, py = cy + Math.sin(a) * ry * r; i ? x.lineTo(px, py) : x.moveTo(px, py); }
    x.closePath();
  }
  function box3d(x, X, Y, w, h, d, c1, c2, c3) { // 정면/측면/윗면
    x.fillStyle = c1; x.fillRect(X, Y, w, h);
    x.fillStyle = c2; x.beginPath(); x.moveTo(X + w, Y); x.lineTo(X + w + d, Y - d * .6); x.lineTo(X + w + d, Y + h - d * .6); x.lineTo(X + w, Y + h); x.fill();
    x.fillStyle = c3; x.beginPath(); x.moveTo(X, Y); x.lineTo(X + d, Y - d * .6); x.lineTo(X + w + d, Y - d * .6); x.lineTo(X + w, Y); x.fill();
  }
  function hazard(x, X, Y, w, h, step = 22) {
    x.save(); x.beginPath(); x.rect(X, Y, w, h); x.clip(); x.fillStyle = '#E8B90F'; x.fillRect(X, Y, w, h); x.fillStyle = '#1d1d1d';
    for (let i = -h; i < w + h; i += step * 2) { x.beginPath(); x.moveTo(X + i, Y + h); x.lineTo(X + i + step, Y + h); x.lineTo(X + i + step + h, Y); x.lineTo(X + i + h, Y); x.fill(); }
    x.restore();
  }
  /* 공통 배경: 정비고(검수고) 내부 원근 */
  function shed(x, R, o = {}) {
    const hz = o.hz || 250, vp = o.vp || 400;
    let g = x.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#2c3238'); g.addColorStop(1, '#5d656d'); x.fillStyle = g; x.fillRect(0, 0, W, hz);
    // 지붕 트러스
    x.strokeStyle = 'rgba(20,24,28,.6)'; x.lineWidth = 3;
    for (let k = 1; k < 9; k++) { const y = hz - (hz - 5) / (k * .55 + .6); const s = (hz - y) / hz; x.beginPath(); x.moveTo(vp - 1600 * s * .5, y); x.lineTo(vp + 1600 * s * .5, y); x.stroke(); }
    // 조명 (원근 배열)
    for (let k = 0; k < 7; k++) {
      const t = 1 / (k * .9 + 1); const y = hz - (hz - 30) * t; const w = 220 * t; [-1, 1].forEach(sd => {
        const cx = vp + sd * 260 * t; x.save(); x.shadowColor = 'rgba(255,250,230,.9)'; x.shadowBlur = 30 * t + 6; x.fillStyle = '#FFFBEA'; x.fillRect(cx - w / 2, y, w, Math.max(2, 9 * t)); x.restore();
      });
    }
    // 뒷벽
    const wy = hz - 70; g = x.createLinearGradient(0, wy, 0, hz); g.addColorStop(0, '#7d868d'); g.addColorStop(1, '#949ca1'); x.fillStyle = g; x.fillRect(vp - 330, wy, 660, 70);
    x.fillStyle = 'rgba(225,238,248,.8)'; for (let i = 0; i < 9; i++) x.fillRect(vp - 300 + i * 68, wy + 10, 44, 22);
    x.fillStyle = '#5a6168'; x.fillRect(vp - 70, wy + 30, 140, 40); // 출입 셔터
    for (let i = 0; i < 8; i++) { x.fillStyle = 'rgba(0,0,0,.15)'; x.fillRect(vp - 70, wy + 32 + i * 5, 140, 1); }
    // 측벽
    [-1, 1].forEach(sd => { x.fillStyle = sd < 0 ? '#6e767c' : '#636b71'; x.beginPath(); x.moveTo(vp + sd * 330, wy); x.lineTo(sd < 0 ? 0 : W, wy - 120); x.lineTo(sd < 0 ? 0 : W, hz + 40); x.lineTo(vp + sd * 330, hz); x.fill(); });
    // 바닥
    g = x.createLinearGradient(0, hz, 0, H); g.addColorStop(0, '#6f7271'); g.addColorStop(1, '#a5a59f'); x.fillStyle = g; x.fillRect(0, hz, W, H - hz);
    // 바닥 얼룩
    for (let i = 0; i < 40; i++) { const y = hz + 10 + R() * (H - hz); const s = (y - hz) / (H - hz); x.fillStyle = `rgba(${R() < .5 ? '40,38,32' : '200,200,190'},${.03 + R() * .05})`; blob(x, R() * W, y, 20 + 90 * s * R(), (8 + 30 * s * R()), R); x.fill(); }
    // 신축 줄눈
    x.strokeStyle = 'rgba(40,40,40,.25)'; x.lineWidth = 1.2;
    for (let i = -6; i <= 6; i++) { x.beginPath(); x.moveTo(vp + i * 50, hz); x.lineTo(vp + i * 420, H); x.stroke(); }
    for (let k = 1; k < 7; k++) { const y = hz + (H - hz) * Math.pow(k / 7, 1.8); x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
    // 바닥 반사광
    for (let k = 0; k < 5; k++) { const t = 1 / (k * .9 + 1); const y = hz + (H - hz) * (1 - t) * .9 + 8; g = x.createRadialGradient(vp, y, 2, vp, y, 140 * t + 20); g.addColorStop(0, 'rgba(255,250,235,.18)'); g.addColorStop(1, 'rgba(255,250,235,0)'); x.fillStyle = g; x.fillRect(0, hz, W, H - hz); }
    return { hz, vp };
  }
  function rails(x, hz, vp, half = 150, gauge = 7) {
    [-1, 1].forEach(sd => {
      const xb = vp + sd * half, xt = vp + sd * gauge;
      x.fillStyle = '#3a3d40'; x.beginPath(); x.moveTo(xt - 1, hz); x.lineTo(xt + 1, hz); x.lineTo(xb + 9, H); x.lineTo(xb - 9, H); x.fill();
      x.fillStyle = '#c9ccce'; x.beginPath(); x.moveTo(xt - .5, hz); x.lineTo(xt + .5, hz); x.lineTo(xb + 3, H); x.lineTo(xb - 3, H); x.fill();
    });
  }
  function hose(x, pts, w = 9) { x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#111'; x.lineWidth = w; x.beginPath(); x.moveTo(...pts[0]); x.bezierCurveTo(...pts[1], ...pts[2], ...pts[3]); x.stroke(); x.strokeStyle = 'rgba(255,255,255,.18)'; x.lineWidth = w * .25; x.stroke(); }

  /* ---- 장면들 ---- */
  const scenes = {
    oil(x, R, kind) { // 검수고 바닥 유압유 누유
      const { hz, vp } = shed(x, R); rails(x, hz, vp, 210, 9);
      // 유압잭
      box3d(x, 560, 330, 120, 95, 34, '#D9A50B', '#A87F06', '#EFC741'); hazard(x, 560, 405, 120, 14, 12);
      x.fillStyle = '#333'; x.fillRect(585, 300, 18, 32); x.fillStyle = '#9aa0a5'; x.fillRect(588, 270, 12, 32);
      x.fillStyle = '#222'; x.fillRect(570, 425, 18, 8); x.fillRect(655, 425, 18, 8);
      hose(x, [[565, 360], [480, 360], [470, 470], [380, 480]]);
      x.fillStyle = '#777'; x.fillRect(372, 474, 16, 12);
      if (kind === 'before') {
        x.save(); x.translate(0, 0);
        x.beginPath(); [[420,500,150,40],[350,508,70,22],[495,490,80,24],[455,515,90,20]].forEach(([a,b,c,d])=>{ for (let i = 0; i <= 40; i++) { const t = (i / 40) * Math.PI * 2; const rr = 1 + Math.sin(t * 3 + a) * .06 + (R() - .5) * .05; const px = a + Math.cos(t) * c * rr, py = b + Math.sin(t) * d * rr; i ? x.lineTo(px, py) : x.moveTo(px, py); } x.closePath(); }); const g = x.createRadialGradient(420, 500, 10, 420, 500, 160); g.addColorStop(0, 'rgba(18,14,8,.92)'); g.addColorStop(.7, 'rgba(30,24,14,.75)'); g.addColorStop(1, 'rgba(40,32,20,.35)'); x.fillStyle = g; x.fill();
        x.clip(); const sh = x.createLinearGradient(300, 470, 540, 530); ['rgba(120,60,160,.25)', 'rgba(40,140,170,.22)', 'rgba(170,150,40,.2)', 'rgba(160,60,90,.2)'].forEach((c, i) => sh.addColorStop(i / 3, c)); x.fillStyle = sh; x.fillRect(250, 440, 360, 120);
        x.fillStyle = 'rgba(255,250,235,.28)'; blob(x, 440, 492, 50, 8, R); x.fill();
        x.restore();
        for (let i = 0; i < 6; i++) { x.fillStyle = 'rgba(20,16,10,.75)'; blob(x, 470 + R() * 120, 440 + R() * 30, 6 + R() * 10, 3 + R() * 3, R); x.fill(); }
        x.fillStyle = 'rgba(20,16,10,.8)'; blob(x, 380, 487, 10, 6, R); x.fill(); // 연결부 누설
        for (let i = 0; i < 4; i++) { x.fillStyle = 'rgba(15,12,8,.9)'; x.beginPath(); x.ellipse(381 + i * 2, 490 + i * 3, 2, 3, 0, 0, 7); x.fill(); }
      } else {
        // 새 호스 + 오일받이 + 깨끗한 바닥
        x.fillStyle = '#8e969c'; x.beginPath(); x.moveTo(330, 478); x.lineTo(440, 478); x.lineTo(452, 500); x.lineTo(318, 500); x.fill(); x.fillStyle = '#b8bfc4'; x.fillRect(330, 476, 110, 4);
        x.fillStyle = 'rgba(255,255,255,.12)'; blob(x, 430, 520, 120, 20, R); x.fill();
        x.fillStyle = '#2e7d32'; x.fillRect(371, 470, 18, 5);
      }
      return '#f3e6c8';
    },
    pit(x, R, kind) { // 피트 진입부 안전난간
      const hz = 230, vp = 400; shed(x, R, { hz, vp });
      // 피트
      const L = (y) => vp - 6 - (y - hz) / (H - hz) * 190, Rr = (y) => vp + 6 + (y - hz) / (H - hz) * 190;
      x.fillStyle = '#1b1d1f'; x.beginPath(); x.moveTo(L(hz), hz); x.lineTo(Rr(hz), hz); x.lineTo(Rr(H), H); x.lineTo(L(H), H); x.fill();
      let g = x.createLinearGradient(0, hz, 0, H); g.addColorStop(0, 'rgba(90,95,100,.2)'); g.addColorStop(1, 'rgba(160,165,168,.55)');
      x.fillStyle = g; x.beginPath(); x.moveTo(L(hz), hz); x.lineTo(L(hz) + 4, hz); x.lineTo(L(H) + 60, H); x.lineTo(L(H), H); x.fill();
      x.beginPath(); x.moveTo(Rr(hz), hz); x.lineTo(Rr(hz) - 4, hz); x.lineTo(Rr(H) - 60, H); x.lineTo(Rr(H), H); x.fill();
      for (let k = 0; k < 6; k++) { const t = 1 / (k + 1.2); const y = hz + (H - hz) * (1 - t) * .95; x.fillStyle = 'rgba(255,240,200,.5)'; x.fillRect(L(y) + 8, y, 6, 3); } // 피트 조명
      // 피트 가장자리 안전 띠 + 레일

        x.save(); x.beginPath(); x.moveTo(f(hz), hz); x.lineTo(f(hz) + sd * 3, hz); x.lineTo(f(H) + sd * 46, H); x.lineTo(f(H), H); x.clip(); hazard(x, 0, hz, W, H - hz, 26); x.restore();
        x.fillStyle = '#cfd2d4'; x.beginPath(); x.moveTo(f(hz) + sd * 4, hz); x.lineTo(f(hz) + sd * 5, hz); x.lineTo(f(H) + sd * 58, H); x.lineTo(f(H) + sd * 50, H); x.fill();
      });
      // 난간 (왼쪽)
      const posts = [0.98, 0.78, 0.6, 0.46, 0.35, 0.27];
      const P = s => { const y = hz + (H - hz) * s; return { x: L(y) - 22 * s - 4, y, h: 150 * s + 10 }; };
      const missing = kind === 'before' ? new Set([1, 2]) : new Set();
      x.lineCap = 'round';
      posts.forEach((s, i) => { if (missing.has(i)) return; const p = P(s); x.strokeStyle = '#E2B10C'; x.lineWidth = 10 * s + 2; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p.x, p.y - p.h); x.stroke(); x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 2 * s + .5; x.beginPath(); x.moveTo(p.x - 2 * s, p.y); x.lineTo(p.x - 2 * s, p.y - p.h); x.stroke(); });
      for (let i = 0; i < posts.length - 1; i++) {
        if (missing.has(i) || missing.has(i + 1)) continue; const a = P(posts[i]), b = P(posts[i + 1]);
        [1, .5].forEach(f => { x.strokeStyle = '#E2B10C'; x.lineWidth = 7 * posts[i] + 1.5; x.beginPath(); x.moveTo(a.x, a.y - a.h * f); x.lineTo(b.x, b.y - b.h * f); x.stroke(); });
      }
      if (kind === 'before') {

/* ---------- 2. 저장소 계층 (IndexedDB, 실패 시 메모리 대체) ---------- */
const DB = {
  db: null, mem: null, mode: 'idb',
  async open() {
    try {
      if (!('indexedDB' in window) || !window.indexedDB) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('srsi_db', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          ['inspections', 'drafts', 'photos'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); });
          if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
        setTimeout(() => rej(new Error('timeout')), 6000);
      });
      this.mode = 'idb';
      return true;
    } catch (e) {
      this.db = null; this.mode = 'memory';
      this.mem = { inspections: new Map(), drafts: new Map(), photos: new Map(), meta: new Map() };
      return false;
    }
  },
  _req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      let out;
      try {
        const tx = this.db.transaction(store, mode);
        tx.oncomplete = () => res(out);
        tx.onerror = () => rej(tx.error);
        tx.onabort = () => rej(tx.error || new Error('트랜잭션이 중단되었습니다'));
        out = fn(tx.objectStore(store));
        if (out && out.onsuccess !== undefined) { const r = out; r.onsuccess = () => { out = r.result; }; }
      } catch (e) { rej(e); }
    });
  },
  key(store) { return store === 'meta' ? 'key' : 'id'; },
  async getAll(store) { if (this.mem) return [...this.mem[store].values()].map(clone); return this._tx(store, 'readonly', s => s.getAll()); },
  async get(store, k) { if (this.mem) { const v = this.mem[store].get(k); return v ? clone(v) : undefined; } return this._tx(store, 'readonly', s => s.get(k)); },
  async put(store, v) { if (this.mem) { this.mem[store].set(v[this.key(store)], clone(v)); return; } return this._tx(store, 'readwrite', s => { s.put(v); }); },
  async putMany(store, arr) { if (!arr.length) return; if (this.mem) { arr.forEach(v => this.mem[store].set(v[this.key(store)], clone(v))); return; } return this._tx(store, 'readwrite', s => { arr.forEach(v => s.put(v)); }); },
  async del(store, k) { if (this.mem) { this.mem[store].delete(k); return; } return this._tx(store, 'readwrite', s => { s.delete(k); }); },
  async clear(store) { if (this.mem) { this.mem[store].clear(); return; } return this._tx(store, 'readwrite', s => { s.clear(); }); }
};

async function hydrate(root = document) {

  await Promise.all(imgs.map(async img => {
    img.dataset.loaded = '1';
    const d = await getPhoto(img.dataset.pid);

function pickFiles(camera, multiple = true) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = multiple && !camera;
    if (camera) inp.setAttribute('capture', 'environment');
    inp.style.display = 'none';
    inp.addEventListener('change', () => { res(Array.from(inp.files || [])); inp.remove(); });

async function processImage(file) {
  const okType = /^image\/(jpeg|jpg|png|webp|gif|bmp|heic|heif)$/i.test(file.type) || /\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(file.name || '');
  if (!okType) throw new Error(`이미지 파일(JPG·PNG·WEBP 등)만 첨부할 수 있습니다: ${file.name}`);
  if (file.size === 0) throw new Error(`빈 파일입니다: ${file.name}`);
  if (file.size > 25 * 1024 * 1024) throw new Error(`사진 용량이 너무 큽니다(최대 25MB): ${file.name}`);
  const url = URL.createObjectURL(file);
  try {
    let img;
    try {
      img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('decode')); i.src = url; });
    } catch (e) { throw new Error(`이미지를 읽을 수 없습니다. 지원되지 않는 형식이거나 손상된 파일입니다: ${file.name}`); }
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) throw new Error(`이미지 크기를 확인할 수 없습니다: ${file.name}`);
    const s = Math.min(1, 1280 / Math.max(w, h));
    const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
    let data;
    try {
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      data = c.toDataURL('image/jpeg', 0.7);
    } catch (e) { data = null; }
    if (!data || data.length < 200) throw new Error(`사진 압축에 실패했습니다: ${file.name}`);
    return data;
  } finally { URL.revokeObjectURL(url); }
}

}

function buildSnapshot(catIds, existing) {

    out.push({ id: tc.id, name: tc.name, rule: tc.rule, items });
  });
  keep.forEach(c => { if (!out.includes(c)) out.push(c); }); // 템플릿에서 삭제된 분야라도 기존 점검본은 유지
  return out;
}

/* 모달: 브라우저 alert/confirm 대신 자체 대화상자 사용 */
function modal({ title, html = '', buttons = [{ label: '확인', cls: 'primary', value: true }], wide = false, onOpen }) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="body">${html}</div><div class="foot"></div></div>`;
    const foot = $('.foot', bg); const m = $('.modal', bg);
    const close = v => { bg.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    buttons.forEach(b => {
      const el = document.createElement('button'); el.type = 'button'; el.className = 'btn ' + (b.cls || ''); el.textContent = b.label;
      el.addEventListener('click', async () => { if (b.onClick) { const r = await b.onClick(m); if (r === false) return; close(r === undefined ? b.value : r); } else close(b.value); });
      foot.appendChild(el);
    });
    bg.addEventListener('click', e => { if (e.target === bg) close(null); });
    document.addEventListener('keydown', onKey);
    $('#modalRoot').appendChild(bg);
    if (onOpen) onOpen(m, close);
    const f = $('input,textarea,select', m); if (f) setTimeout(() => f.focus(), 30);
  });
}
const confirmBox = (title, html, ok = '확인', danger = false) => modal({ title, html, buttons: [{ label: '취소', value: false }, { label: ok, cls: danger ? 'danger' : 'primary', value: true }] }).then(v => v === true);
const alertBox = (title, html) => modal({ title, html, buttons: [{ label: '확인', cls: 'primary', value: true }] });

/* 파일 저장: 아티팩트 환경이면 downloads 기능, 아니면 일반 다운로드 링크 */
let dlNs = null, dlReady = null;
function initDownloads() {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      dlReady = Promise.race([Promise.resolve(window.claude.use('downloads')), sleep(10500).then(() => null)]).then(ns => (dlNs = ns)).catch(() => null);
    }
  } catch (e) { dlReady = null; }
}
async function saveFile(filename, data, mime) {
  if (!dlNs && dlReady) { try { await dlReady; } catch (e) { /* 무시 */ } }
  if (dlNs) {
    try { await dlNs.save({ filename, data }); toast('파일을 저장했습니다: ' + filename, 'ok'); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') { toast('파일 저장이 취소되었습니다.', 'warn'); return false; }
      if (c === 'rate_limited') { toast('잠시 후 다시 시도해 주세요.', 'warn'); return false; }
      if (c === 'host_unavailable') { toast('이 앱에서는 파일 저장이 지원되지 않습니다. 브라우저나 PC에서 열어 주세요.', 'err', 5000); return false; }
      if (c !== 'unavailable' && c !== 'not_granted' && c !== 'capability_disabled' && c !== 'capability_removed') { toast('파일 저장 실패: ' + ((e && e.message) || c), 'err', 5000); return false; }
    }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('다운로드를 시작했습니다: ' + filename, 'ok'); return true;
  } catch (e) { toast('이 환경에서는 파일 다운로드가 차단되었습니다.', 'err', 5000); return false; }
}

/* ---------- 자동저장 ---------- */
function setSaveState(st) {
  const el = $('#saveState'); if (!el) return;
  if (!S.cur || S.view !== 'inspect') { el.classList.add('hidden'); return; }
  el.classList.remove('hidden', 'saving', 'fail', 'saved');
  if (st === 'pending') { el.textContent = '변경됨 · 저장 대기'; }
  else if (st === 'saving') { el.classList.add('saving'); el.textContent = '저장 중…'; }
  else if (st === 'saved') { el.classList.add('saved'); el.textContent = '자동저장됨 ' + fmtTime(new Date()); }
  else if (st === 'fail') { el.classList.add('fail'); el.textContent = '저장 실패 · 눌러서 재시도'; }
  else { el.textContent = S.cur.updatedAt ? '저장됨 ' + fmtTime(S.cur.updatedAt) : '새 점검'; }
}
function markDirty() {
  if (!S.cur) return;
  S.dirty = true; S.ver++; setSaveState('pending');
  clearTimeout(S.saveTimer); S.saveTimer = setTimeout(() => saveDraft(false), 1000);
}
async function saveDraft(manual) {
  clearTimeout(S.saveTimer); S.saveTimer = null;
  if (!S.cur) return true;
  if (S.saving) { await S.saving; if (!S.dirty) { if (manual) toast('임시저장되었습니다.', 'ok'); return true; } }
  const ver = S.ver; setSaveState('saving');
  const p = (async () => {
    try {
      S.cur.updatedAt = Date.now();
      const snap = clone(S.cur);
      await DB.put('drafts', snap);
      const i = S.drafts.findIndex(d => d.id === snap.id); if (i >= 0) S.drafts[i] = snap; else S.drafts.push(snap);
      if (S.ver === ver) S.dirty = false;
      setSaveState('saved'); if (manual) toast('임시저장되었습니다.', 'ok');
      if (S.dirty) { clearTimeout(S.saveTimer); S.saveTimer = setTimeout(() => saveDraft(false), 1000); }
      return true;
    } catch (e) { setSaveState('fail'); toast(storageErrMsg(e), 'err', 6000); return false; }
  })();
  S.saving = p; const r = await p; S.saving = false; return r;
}
async function flushSave() {
  if (!S.cur) return true;
  if (S.saveTimer || S.dirty) return saveDraft(false);
  if (S.saving) return S.saving;
  return true;
}
window.addEventListener('beforeunload', e => { if (S.cur && (S.dirty || S.saveTimer)) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });

}
async function startNew() {
  if (S.cur) { await flushSave(); }
  S.cur = newInspObj(); S.etcOpen = new Set(); S.open = new Set(); S.noteOpen = new Set(); S.filter = 'all'; S.showInvalid = false; S.lastJump = -1; S.dirty = false;

async function resumeDraft(id) {

async function onStructChange(field, value) {
  const c = S.cur;
  if (c.categories.length && c.info[field] !== value) {
    const hasResp = Object.values(c.responses).some(r => r && (r.result || r.note || (r.photos || []).length));
    if (hasResp) {
      const ok = await confirmBox('점검 조건 변경', '점검 대상·작업구역·작업 유형을 변경하면 체크리스트가 다시 구성되며, <b>제외되는 분야의 기존 응답·사진·부적합 정보가 삭제될 수 있습니다.</b><br><br>변경하시겠습니까?', '변경', true);
      if (!ok) { renderInspect(); return; }
    }
    c.needRecompose = true;
  }
  c.info[field] = value;
  if (field === 'target') { if (value !== '철도차량') { c.info.vehicleType = ''; c.info.vehicleNo = ''; } if (value !== '정비설비') { c.info.equipName = ''; c.info.equipNo = ''; } }
  markDirty(); renderInspect();
}
async function toStep2() {

    S.showInvalidInfo = true; renderInspect();
    const el = $('#f-' + miss[0][0]); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    toast(`필수 입력 항목 ${miss.length}개가 비어 있습니다: ${miss.map(m => m[1]).join(', ')}`, 'err', 4500); return false;
  }
  S.showInvalidInfo = false;
  if (!S.cur.selectedCats || S.cur.needRecompose) {
    const rec = recommendCats(S.cur.info);
    const prevRec = S.cur.prevRec ? new Set(S.cur.prevRec) : new Set();
    const extras = (S.cur.selectedCats || []).filter(id => !prevRec.has(id));
    S.cur.selectedCats = [...new Set([...rec, ...extras])];
    S.cur.prevRec = [...rec];
  }
  S.cur.step = 2; markDirty(); renderInspect(); window.scrollTo(0, 0); return true;
}

async function updateNg(inspId, itemId, patch) {

async function backup() {

function validateBackup(o) {
  if (!o || typeof o !== 'object') return '올바른 JSON 객체가 아닙니다.';
  if (o.app !== APP_ID) return '이 시스템의 백업 파일이 아닙니다.';
  if (!Number.isInteger(o.schemaVersion) || o.schemaVersion > SCHEMA_VERSION || o.schemaVersion < 1) return `지원하지 않는 데이터 구조 버전입니다(${esc(o.schemaVersion)}).`;
  const d = o.data; if (!d || typeof d !== 'object') return '데이터 영역이 없습니다.';
  for (const k of ['inspections', 'drafts', 'photos']) if (!Array.isArray(d[k])) return `필수 데이터(${k})가 없습니다.`;
  if (!d.meta || !d.meta.template || !Array.isArray(d.meta.template.categories)) return '설정(템플릿) 데이터가 올바르지 않습니다.';
  const okInsp = i => i && typeof i.id === 'string' && i.info && typeof i.info === 'object' && Array.isArray(i.categories) && i.categories.every(c => c && Array.isArray(c.items)) && i.responses && typeof i.responses === 'object';
  if (!d.inspections.every(okInsp)) return '점검 기록 중 형식이 올바르지 않은 데이터가 있습니다.';
  if (!d.drafts.every(okInsp)) return '임시저장 데이터 중 형식이 올바르지 않은 데이터가 있습니다.';
  if (!d.photos.every(p => p && typeof p.id === 'string' && typeof p.data === 'string' && p.data.startsWith('data:image/'))) return '사진 데이터 형식이 올바르지 않습니다.';
  return null;
}
async function restore() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json'; inp.style.display = 'none'; document.body.appendChild(inp);
  const file = await new Promise(r => { inp.onchange = () => r(inp.files && inp.files[0]); inp.click(); }); inp.remove();
  if (!file) return;
  let obj; try { obj = JSON.parse(await file.text()); } catch (e) { alertBox('복원 실패', 'JSON 파일을 읽을 수 없습니다. 기존 데이터는 변경되지 않았습니다.'); return; }
  const err = validateBackup(obj); if (err) { alertBox('복원 실패', esc(err) + '<br>기존 데이터는 변경되지 않았습니다.'); return; }
  const d = obj.data;
  const mode = await modal({ title: '백업 복원', html: `<p>백업 일시: <b>${esc(fmtDT(obj.exportedAt))}</b><br>점검 ${d.inspections.length}건 · 임시저장 ${d.drafts.length}건 · 사진 ${d.photos.length}장</p>
    <p><b>병합</b>: 현재 데이터를 유지하고, 없는 기록만 추가합니다(고유 ID 기준 중복 방지).<br><b>덮어쓰기</b>: 현재 데이터를 모두 지우고 백업으로 교체합니다.</p><div class="notice warn" style="margin:0">덮어쓰기 전에 현재 데이터를 먼저 백업하는 것을 권장합니다.</div>`,
    buttons: [{ label: '취소', value: null }, { label: '현재 데이터 먼저 백업', value: 'bk' }, { label: '병합', cls: 'outline', value: 'merge' }, { label: '덮어쓰기', cls: 'danger', value: 'over' }] });
  if (mode === 'bk') { await backup(); toast('백업 후 다시 [백업 파일 복원]을 진행하세요.', 'warn', 4000); return; }
  if (!mode) return;
  if (mode === 'over' && !(await confirmBox('덮어쓰기 확인', '현재 데이터가 모두 삭제되고 백업 데이터로 교체됩니다. 계속하시겠습니까?', '덮어쓰기', true))) return;
  try {
    if (S.cur) { await flushSave(); }
    if (mode === 'over') {
      for (const s of ['inspections', 'drafts', 'photos', 'meta']) await DB.clear(s);
      PH.clear();
      await DB.putMany('photos', d.photos); await DB.putMany('inspections', d.inspections); await DB.putMany('drafts', d.drafts);
      const meta = Object.assign(defaultMeta(), d.meta, { key: 'main', seeded: true }); await DB.put('meta', meta);
      S.cur = null;
    } else {
      const hasI = new Set(S.inspections.map(i => i.id)), hasD = new Set(S.drafts.map(i => i.id)); const docs = new Set(S.inspections.map(i => i.docNo));
      const exPh = new Set((await DB.getAll('photos')).map(p => p.id));
      const newI = d.inspections.filter(i => !hasI.has(i.id)).map(i => { if (docs.has(i.docNo)) { let n = 1; while (docs.has(`${i.docNo}-M${n}`)) n++; i.docNo = `${i.docNo}-M${n}`; } docs.add(i.docNo); return i; });
      const newD = d.drafts.filter(i => !hasD.has(i.id) && !hasI.has(i.id)); const newP = d.photos.filter(p => !exPh.has(p.id));
      await DB.putMany('photos', newP); await DB.putMany('inspections', newI); await DB.putMany('drafts', newD);
      toast(`병합 완료: 점검 ${newI.length}건, 임시저장 ${newD.length}건, 사진 ${newP.length}장 추가 (중복 ${d.inspections.length - newI.length}건 제외)`, 'ok', 5000);
    }
    await loadAll(); if (S.cur && !S.drafts.some(x => x.id === S.cur.id)) S.cur = null;
    if (mode === 'over') toast('복원이 완료되었습니다.', 'ok');
    S.view = 'dashboard'; render();
  } catch (e) { alertBox('복원 실패', esc(storageErrMsg(e))); await loadAll(); render(); }
}

  restore: () => restore(),
  'save-time': async () => {
    const b = +$('#s-before').value, a = +$('#s-after').value;
    if (!(b > 0) || !(a >= 0) || a > b) { toast('기존 소요시간은 0보다 커야 하며, 자동화 후 시간은 기존 시간 이하여야 합니다.', 'err', 4000); return; }
    S.meta.settings = { beforeMin: b, afterMin: a }; await saveMeta(); toast('저장했습니다.', 'ok');
  },
  'tpl-add': async el => { const c = tplCat(el.dataset.cat); const t = await tplItemModal(`항목 추가 · ${c.name}`); if (!t) return; if (tplDup(t)) { toast('동일한 항목이 템플릿에 이미 있습니다.', 'err'); return; } c.items.push({ id: uid('t'), text: t }); await saveMeta(); render(); toast('템플릿에 항목을 추가했습니다.', 'ok'); },
  'tpl-edit': async el => { const c = tplCat(el.dataset.cat); const it = c.items.find(x => x.id === el.dataset.id); const t = await tplItemModal('항목 수정', it.text); if (!t) return; if (tplDup(t, it.id)) { toast('동일한 항목이 템플릿에 이미 있습니다.', 'err'); return; } it.text = t; await saveMeta(); render(); toast('수정했습니다. 과거 점검 기록은 변경되지 않습니다.', 'ok'); },
  'tpl-del': async el => { const c = tplCat(el.dataset.cat); const it = c.items.find(x => x.id === el.dataset.id); if (!(await confirmBox('템플릿 항목 삭제', `「${esc(it.text)}」 항목을 기본 템플릿에서 삭제합니다.<br>과거 점검 기록과 진행 중인 점검에는 영향이 없습니다.`, '삭제', true))) return; c.items = c.items.filter(x => x.id !== it.id); await saveMeta(); render(); toast('삭제했습니다.'); },
  'tpl-add-cat': async () => {
    const n = await modal({ title: '점검 분야 추가', html: `<label class="f" for="t-cat">분야 이름</label><input class="inp" id="t-cat" placeholder="예: 보건·위생"><div class="err-msg hidden" id="t-err"></div><p class="hint">추가한 분야는 자동 추천되지 않으며, 체크리스트 구성 단계에서 선택할 수 있습니다.</p>`,
      buttons: [{ label: '취소', value: null }, { label: '추가', cls: 'primary', onClick: m => { const v = $('#t-cat', m).value.trim(); const e = $('#t-err', m); if (!v) { e.textContent = '이름을 입력하세요.'; e.classList.remove('hidden'); return false; } if (S.meta.template.categories.some(c => norm(c.name) === norm(v))) { e.textContent = '같은 이름의 분야가 있습니다.'; e.classList.remove('hidden'); return false; } return v; } }] });
    if (!n) return; S.meta.template.categories.push({ id: uid('cat'), name: n, rule: 'custom', items: [] }); await saveMeta(); render(); toast('분야를 추가했습니다.', 'ok');
  },
  'tpl-del-cat': async el => { const c = tplCat(el.dataset.cat); if (!(await confirmBox('분야 삭제', `「${esc(c.name)}」 분야를 템플릿에서 삭제합니다. 과거 점검 기록에는 영향이 없습니다.`, '삭제', true))) return; S.meta.template.categories = S.meta.template.categories.filter(x => x.id !== c.id); await saveMeta(); render(); },
  'tpl-reset': async () => { if (!(await confirmBox('템플릿 기본값 복원', '기본 체크리스트 템플릿을 시연용 기본값으로 되돌립니다. 과거 점검 기록에는 영향이 없습니다.', '복원', true))) return; S.meta.template = defaultTemplate(); await saveMeta(); render(); toast('기본값으로 복원했습니다.', 'ok'); },
  'reset-demo': async () => { if (!(await confirmBox('시연 데이터 초기화', '현재 모든 데이터(점검·임시저장·사진·설정)를 삭제하고 시연용 가상 데이터로 초기화합니다. 되돌릴 수 없습니다.', '초기화', true))) return; await wipe(true); toast('시연 데이터로 초기화했습니다.', 'ok'); },
  wipe: async () => { if (!(await confirmBox('전체 데이터 삭제', '모든 점검 기록·임시저장·사진·설정이 삭제됩니다. 되돌릴 수 없습니다.<br>먼저 백업하는 것을 권장합니다.', '전체 삭제', true))) return; await wipe(false); toast('전체 데이터를 삭제했습니다.'); }
};
async function deletePhotoFromNg(ng, arr, i) {
  await deletePhoto(arr, i, async () => { await updateNg(ng.dataset.insp, ng.dataset.item, { afterPhotos: arr }); render(); });
}

document.addEventListener('click', e => {
  const img = e.target.closest('img.zoom'); if (img && img.src) { lightbox(img.src); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.tagName === 'INPUT') return;
  const h = ACT[el.dataset.act]; if (h) { e.preventDefault(); Promise.resolve(h(el, e)).catch(err => { console.error(err); toast('오류: ' + err.message, 'err'); }); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.info !== undefined && S.cur) {
    const k = t.dataset.info;
    if (['zone', 'workType'].includes(k)) return; // change 이벤트에서 처리
    S.cur.info[k] = t.value; t.classList.remove('invalid'); markDirty(); return;
  }
  if (t.dataset.f && S.cur) {
    const wrap = t.closest('[data-item]'); if (!wrap) return; const id = wrap.dataset.item;
    setPath(resp(id), t.dataset.f, t.value); if (t.value.trim()) t.classList.remove('invalid');
    markDirty(); refreshItemChrome(id); updateSummary(); return;
  }
  if (t.dataset.opinion && S.cur) { S.cur.opinion = t.value; S.cur.opinionEdited = true; markDirty(); const o = $('#rptOpinion'); if (o) o.textContent = t.value; return; }
  if (t.dataset.hf !== undefined) { S.hf[t.dataset.hf] = t.value; const list = filteredHistory(); $('#histList').innerHTML = histListHTML(list); $('#hfCount').textContent = list.length + '건'; return; }
  if (t.dataset.nf === 'q') { S.nf.q = t.value; clearTimeout(S.nfT); S.nfT = setTimeout(() => { render(); const q = $('#nf-q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 400); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.info && ['zone', 'workType'].includes(t.dataset.info) && S.cur) { onStructChange(t.dataset.info, t.value); return; }
  if (t.dataset.combo && S.cur) {
    const f = t.dataset.combo;
    if (t.value === '__etc') { S.etcOpen.add(f); S.cur.info[f] = ''; markDirty(); renderInspect(); const x = $('#f-' + f + '-etc'); if (x) x.focus(); }
    else { S.etcOpen.delete(f); S.cur.info[f] = t.value; markDirty(); renderInspect(); }
    return;
  }
  if (t.dataset.act === 'compose-toggle') { composeToggle(t); return; }
  if (t.dataset.nf && t.dataset.nf !== 'q') { S.nf[t.dataset.nf] = t.type === 'checkbox' ? t.checked : t.value; render(); }
});

/* 로그인 */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#pw');
  if (pw.value !== PASSWORD) { $('#pwErr').classList.remove('hidden'); pw.classList.add('invalid'); pw.select(); return; }
  $('#pwErr').classList.add('hidden'); pw.classList.remove('invalid'); SESSION.set(true); enterApp(true);
});
$('#pw').addEventListener('input', () => { $('#pwErr').classList.add('hidden'); $('#pw').classList.remove('invalid'); });

async function enterApp(askResume) {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  S.view = 'dashboard'; render();
  if (askResume && S.drafts.length && !S.cur) {
    const d = [...S.drafts].sort((a, b) => b.updatedAt - a.updatedAt)[0];
    const c = counts(d);
    const v = await modal({ title: '작성 중인 점검이 있습니다', html: `이전에 작성하던 점검을 이어서 작성하시겠습니까?<div class="card" style="margin:12px 0 0;box-shadow:none"><b>${esc(d.info.place || '(점검 장소 미입력)')}</b><br><span class="hint">${esc(d.info.inspector || '-')} · 최종 저장 ${fmtDT(d.updatedAt)} · 진행률 ${c.total ? fmtPct(c.progress) : '체크리스트 미구성'}</span></div>${S.drafts.length > 1 ? `<p class="hint">그 외 임시저장 ${S.drafts.length - 1}건은 대시보드에서 확인할 수 있습니다.</p>` : ''}`,
      buttons: [{ label: '나중에', value: false }, { label: '이어서 작성', cls: 'primary', value: true }] });
    if (v) { resumeDraft(d.id); return; }
  }
  await offerSeedUpdate();
}
/* 시연 데이터 업데이트 안내 (이전 버전 시연 데이터 사용자 대상, 1회) */
async function offerSeedUpdate() {
  if (!S.meta.seeded || (S.meta.seedVersion || 1) >= SEED_VERSION) return;
  while (true) {
    const v = await modal({ title: '시연 데이터 업데이트', html: '새 버전의 시연 데이터가 준비되었습니다.<ul><li>코레일 차량 종류·소속 부서 목록 반영</li><li>개선 전·후 예시 이미지 개선</li></ul>새 시연 데이터로 교체하면 <b>현재 점검 기록·임시저장·사진이 모두 삭제</b>됩니다. 필요한 기록이 있으면 먼저 백업하세요.<br><span class="hint">나중에 설정 › 시연 데이터로 초기화에서도 교체할 수 있습니다.</span>',
      buttons: [{ label: '지금 데이터 유지', value: 'keep' }, { label: '먼저 백업', value: 'bk' }, { label: '새 시연 데이터로 교체', cls: 'primary', value: 'reset' }] });
    if (v === 'bk') { await backup(); continue; }
    if (v === 'reset') { await wipe(true); toast('새 시연 데이터로 교체했습니다.', 'ok'); return; }
    S.meta.seedVersion = SEED_VERSION; await saveMeta(); return;
  }
}
async function init() {
  initDownloads();
  await DB.open();
  try { await loadAll(); }
  catch (e) { console.error(e); toast('데이터를 불러오지 못했습니다: ' + e.message, 'err', 6000); }
  if (DB.mode !== 'idb') toast('브라우저 저장소를 사용할 수 없어 임시 메모리로 동작합니다. 새로고침 시 데이터가 사라집니다.', 'warn', 7000);
  if (SESSION.get()) enterApp(true);
  else { $('#login').classList.remove('hidden'); setTimeout(() => $('#pw').focus(), 50); }
}
init();

</script>
</body>
